[project]
name = "veronica-core"
version = "0.1.0"
description = "Capability-preserving agent wrapper and chat interface for Veronica.v4"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9"
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veronica_core"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/docs", "/config", "/agents", "/scripts",
  "/pyproject.toml", "/uv.lock", "/README.md", "/TODO.md",
  "/PRINTABLE-PLAN.md", "/.env.example"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
