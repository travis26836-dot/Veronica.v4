name: PR Quality & Security Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-node-project:
    name: Detect Node Project
    runs-on: ubuntu-latest
    outputs:
      has_npm_lock: ${{ steps.detect.outputs.has_npm_lock }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
            echo "has_npm_lock=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_npm_lock=false" >> "$GITHUB_OUTPUT"
          fi

  # 1. LINT & FORMAT: Catch syntax and style regressions early
  lint-and-format:
    name: Code Linting & Formatting
    runs-on: ubuntu-latest
    needs: detect-node-project
    if: ${{ needs.detect-node-project.outputs.has_npm_lock == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Swap this section out depending on your language stack (e.g., Node, Python, Go)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Check Code Formatting
        run: npm run format:check

  # 2. SECURITY SCAN: Prevent hardcoded secrets and vulnerable packages
  security-scan:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    needs: detect-node-project
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan for Hardcoded Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      - name: Set up Node for npm audit
        if: ${{ needs.detect-node-project.outputs.has_npm_lock == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit Node dependencies for known vulnerabilities
        if: ${{ needs.detect-node-project.outputs.has_npm_lock == 'true' }}
        run: npm audit --audit-level=high

  # 3. TEST SUITE: Run automated tests to prevent logic regressions
  testing:
    name: Automated Test Suite
    runs-on: ubuntu-latest
    needs: [detect-node-project, lint-and-format] # Only runs for a Node project after lint succeeds.
    if: ${{ needs.detect-node-project.outputs.has_npm_lock == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Integration Tests
        run: npm run test:ci

  # 4. BUILD VERIFICATION: Ensure the application actually compiles
  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [detect-node-project, testing]
    if: ${{ needs.detect-node-project.outputs.has_npm_lock == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
